name: Verify User Data and Migration Tests

on:
  push:
    branches:
      - '**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Base Checks (Simulating Base Commit)
        run: |
          # Fetch origin/main to resolve base commit files
          git fetch origin main || true
          
          # Temporarily restore implementation files to main branch state (base)
          git checkout origin/main -- apps/desktop/electron/backend-env.ts hermes_constants.py hermes_logging.py hermes_state.py hermes_cli/main.py cli.py || true
          mv hermes_cli/migrate.py hermes_cli/migrate.py.bak || true
          
          # Build Docker image representing base commit + test patch (no -v mounts at runtime)
          docker build -f Dockerfile.verify -t verify-runner-base .
          
          echo "=== Phase 1: Base regression checks on base (must pass) ==="
          docker run --rm --network none verify-runner-base bash ./test.sh --output_path results.xml base
          
          echo "=== Phase 2: Challenge tests on base (must fail) ==="
          if docker run --rm --network none verify-runner-base bash ./test.sh --output_path results.xml new; then
            echo "Error: Challenge tests passed on the base commit, but they must fail!" >&2
            exit 1
          else
            echo "Success: Challenge tests correctly failed on the base commit."
          fi

      - name: Run Solution Checks (Simulating Solution Commit)
        run: |
          # Restore implementation files to branch head (solution)
          git checkout HEAD -- apps/desktop/electron/backend-env.ts hermes_constants.py hermes_logging.py hermes_state.py hermes_cli/main.py cli.py || true
          mv hermes_cli/migrate.py.bak hermes_cli/migrate.py || true
          
          # Build Docker image representing solution commit + test patch
          docker build -f Dockerfile.verify -t verify-runner-solution .
          
          echo "=== Phase 3: Base regression checks on solution (must pass) ==="
          docker run --rm --network none verify-runner-solution bash ./test.sh --output_path results.xml base
          
          echo "=== Phase 4: Challenge tests on solution (must pass) ==="
          docker run --rm --network none verify-runner-solution bash ./test.sh --output_path results.xml new

